<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            margin-right: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #e63946;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #d62828;
        }
        #messaggioErrore {
            color: #ff4d4d;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>escape room</h1>
    <p>enigma dificil</p>
    
    <p><strong>INSERIRE CODICE:</strong></p>
    <div>
        <input type="text" id="codiceInput" placeholder="Scrivi qui...">
        <button onclick="verificaCodice()">Invia</button>
    </div>
    
    <p id="messaggioErrore">il codice è uno dei numeri dei treni regionali eboli-napoli.</p>

    <script>
        const input = document.getElementById("codiceInput");

        // Permette di inviare premendo il tasto Invio
        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verificaCodice();
            }
        });

        function verificaCodice() {
            const codiceInserito = input.value.trim();
            
            if (codiceInserito === "5348") {
                // INSERISCI QUI IL LINK DEL TUO SITO
                window.location.href = "file:///C:/Users/26-info-05/Downloads/61-RsL8RAnL._AC_UL450_SY450_QL70_.jpg";
            } else {
                document.getElementById("messaggioErrore").style.display = "block";
            }
        }
    </script>

</body>
</html>
